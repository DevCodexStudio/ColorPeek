name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build both distributions
        run: ./gradlew test legacy:test buildReleaseArtifacts
      - uses: actions/upload-artifact@v4
        with:
          name: colorpeek-distributions
          path: |
            build/distributions/*.zip
            legacy/build/distributions/*.zip
          if-no-files-found: error
